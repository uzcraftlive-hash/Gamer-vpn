<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Gaming VPN</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#070b12;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:25px;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0 30px;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.logo span{
    color:#00e88a;
}

.status{
    color:#00e88a;
    font-size:14px;
}

.hero{
    background:#0d1420;
    border:1px solid #1c2b3d;
    border-radius:25px;
    padding:35px;
    text-align:center;
}

.hero h1{
    font-size:32px;
    margin-bottom:10px;
}

.hero p{
    color:#8492a6;
    margin-bottom:25px;
}

.connect{
    width:160px;
    height:160px;
    border-radius:50%;
    border:8px solid #123c31;
    background:#0b211b;
    color:#00e88a;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

.connect:hover{
    background:#10382d;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-top:20px;
}

.card{
    background:#0d1420;
    border:1px solid #1c2b3d;
    border-radius:18px;
    padding:20px;
}

.card small{
    color:#748398;
}

.card h2{
    margin-top:8px;
}

.server{
    margin-top:20px;
}

.server select{
    width:100%;
    padding:15px;
    margin-top:10px;
    background:#111c2b;
    color:white;
    border:1px solid #26374d;
    border-radius:12px;
    font-size:16px;
}

.download{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:0;
    border-radius:12px;
    background:#00e88a;
    color:#06120d;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

.protocol{
    margin-top:20px;
    color:#8190a5;
}

.protocol b{
    color:#fff;
}

footer{
    text-align:center;
    color:#58677b;
    padding:30px 0 10px;
}

@media(max-width:650px){

    .cards{
        grid-template-columns:1fr;
    }

    .hero{
        padding:25px 15px;
    }

    .hero h1{
        font-size:26px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">
        ⚡ Gaming <span>VPN</span>
    </div>

    <div class="status" id="topStatus">
        ● READY
    </div>
</header>

<section class="hero">

    <h1>Gaming VPN</h1>

    <p>
        Professional gaming connection powered by WireGuard
    </p>

    <button class="connect" onclick="connectVPN()" id="connectButton">
        CONNECT
    </button>

    <div class="protocol">
        Protocol: <b>WireGuard</b>
    </div>

</section>


<div class="cards">

    <div class="card">
        <small>Ping</small>
        <h2 id="ping">-- ms</h2>
    </div>

    <div class="card">
        <small>Download</small>
        <h2 id="download">-- Mbps</h2>
    </div>

    <div class="card">
        <small>Upload</small>
        <h2 id="upload">-- Mbps</h2>
    </div>

</div>


<div class="card server">

    <h2>🌍 VPN Server</h2>

    <select id="server">

        <option value="UZ">🇺🇿 Uzbekistan — Recommended</option>

        <option value="SG">🇸🇬 Singapore</option>

        <option value="DE">🇩🇪 Germany</option>

        <option value="TR">🇹🇷 Turkey</option>

        <option value="JP">🇯🇵 Japan</option>

        <option value="US">🇺🇸 United States</option>

    </select>

    <button class="download" onclick="downloadAPK()">
        📱 DOWNLOAD GAMING VPN APK
    </button>

</div>


<footer>

    Gaming VPN © 2026<br>
    WireGuard Gaming Network

</footer>

</div>


<script>

let connected = false;

function connectVPN(){

    const button =
        document.getElementById("connectButton");

    const status =
        document.getElementById("topStatus");

    if(!connected){

        connected = true;

        button.textContent = "DISCONNECT";

        status.textContent = "● CONNECTED";

        document.getElementById("ping")
            .textContent = "Testing...";

        setTimeout(function(){

            document.getElementById("ping")
                .textContent = "20 ms";

            document.getElementById("download")
                .textContent = "58 Mbps";

            document.getElementById("upload")
                .textContent = "18 Mbps";

        },1000);

    }else{

        connected = false;

        button.textContent = "CONNECT";

        status.textContent = "● READY";

        document.getElementById("ping")
            .textContent = "-- ms";

        document.getElementById("download")
            .textContent = "-- Mbps";

        document.getElementById("upload")
            .textContent = "-- Mbps";
    }
}


function downloadAPK(){

    alert(
      "Gaming VPN APK download link will be connected here."
    );

}

</script>

</body>
</html>
